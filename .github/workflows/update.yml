name: Update schema files

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
        default: esr128
      branch:
        required: true
        type: string
        default: 128-esr-mv3
      manifestVersion:
        required: true
        type: string
        default: 3

jobs:
  update-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout webext-schemas default branch
        uses: actions/checkout@v4

      - name: Checkout target branch ${{ inputs.branch }}
        run: |
          git fetch origin
          git checkout ${{ inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone webext-schemas-generator
        run: |
          git clone https://github.com/thunderbird/webext-schemas-generator.git generator

      - name: Install dependencies
        run: |
          npm install --prefix generator

      - name: Run generator script for --release=${{ inputs.release }} --manifest_version=${{ inputs.manifestVersion }}
        id: generate
        run: |
          node generator/get_thunderbird_schema_files.js --release=${{ inputs.release }} --manifest_version=${{ inputs.manifestVersion }} --output=./schema-files/

      - name: Check for changes
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schema-files
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Changes for ${{ inputs.branch }} with tag ${{ steps.generate.outputs.tag_name }}-mv${{ inputs.manifestVersion }}
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git commit -m "Update schema files (${{ inputs.branch }}, ${{ steps.generate.outputs.tag_name }})"
          git push origin HEAD:${{ inputs.branch }}
          git tag -f ${{ steps.generate.outputs.tag_name }}-mv${{ inputs.manifestVersion }}
          git push origin -f ${{ steps.generate.outputs.tag_name }}-mv${{ inputs.manifestVersion }}
